[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lcl"
version = "1.0.0"
description = "Does self-attention recover context effects? LCL recovery study (M.Tech thesis, IIT Madras)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy", "pandas", "torch", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]
